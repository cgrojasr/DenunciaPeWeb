server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión básica
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Rutas de la SPA (Angular Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy hacia el servicio backend (upc-security-api:8080) que corre en otro contenedor
    # dentro de la misma red Docker.
    location /api/ {
        proxy_pass http://upc-security-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cacheo de assets estáticos
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }
}
