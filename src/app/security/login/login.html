<div class="login-page d-flex align-items-center justify-content-center min-vh-100 p-3">
  <div class="login-card card shadow-lg border-0 overflow-hidden w-100" style="max-width: 900px;">
    <div class="row g-0">

      <section class="login-form col-md-6 p-4 p-md-5">
        <div class="brand fw-bold mb-4">DenunciaPe</div>

        <h1 class="h3 fw-bold mb-4">BIENVENIDO</h1>

        <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
          <div class="mb-3">
            <label for="identifier" class="form-label">Usuario</label>
            <input
              id="identifier"
              name="identifier"
              type="text"
              class="form-control"
              placeholder="DNI"
              [(ngModel)]="identifier"
              required
            />
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input
              id="password"
              name="password"
              type="password"
              class="form-control"
              placeholder="••••••••"
              [(ngModel)]="password"
              required
            />
          </div>

          @if (errorMessage) {
            <p class="text-danger small">{{ errorMessage }}</p>
          }

          <button type="submit" class="btn btn-login w-100 fw-bold mt-2" [disabled]="loginForm.invalid || loading">
            {{ loading ? 'Ingresando...' : 'INGRESAR' }}
          </button>
        </form>
      </section>

      <section class="login-illustration col-md-6 d-flex flex-column align-items-center justify-content-center gap-4 py-5">
        <div class="icon-row d-flex gap-4 fs-4">
          <span>🔒</span>
          <span>🔑</span>
          <span>🌐</span>
          <span>⚙️</span>
        </div>
        <div class="illustration-box d-flex flex-column align-items-center gap-3 p-4 rounded-3">
          <span class="lock-icon fs-1">🔒</span>
          <div class="fake-field d-flex align-items-center gap-2 rounded-2 px-3 py-2 w-100"><span>👤</span> XXXXXXX</div>
          <div class="fake-field d-flex align-items-center gap-2 rounded-2 px-3 py-2 w-100"><span>🔒</span> ●●●●●●●</div>
        </div>
      </section>

    </div>
  </div>
</div>
